[package]
name = "material_3_music"
version = "0.1.0"
edition = "2021"
description = "A Material 3 YouTube Music client and local music player, built with egui"
license = "MIT"

[[bin]]
name = "m3-music"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
material-3-ui = { git = "https://github.com/bhimio1/material-3-ui", rev = "5555579277ac2da1e0f1c15c2f2342d9bfd002b9" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ureq = { version = "2.12", features = ["json", "native-certs"] }
zbus = "4"
lofty = "0.22"
sha1 = "0.10"
notify = "6"
flume = "0.11"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
dirs = "6"
anyhow = "1"
chrono = "0.4"
fastrand = "2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
